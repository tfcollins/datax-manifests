common_deps: &common
  - build-essential
  - git
  - make
  - x11-utils
  # BOOT.BIN helpers: unzip reads the XSA, wget fetches ADI's prebuilt u-boot,
  # the aarch64 cross-compiler builds arm-trusted-firmware for ZynqMP/Versal.
  - unzip
  - wget
  - gcc-aarch64-linux-gnu

linux-x86_64:
  ubuntu-22.04:
    command: "apt-get install"
    packages: *common
  ubuntu-24.04:
    command: "apt-get install"
    packages: *common
