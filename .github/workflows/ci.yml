name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: "Run a real Vivado build on hdl-dev-2 (slow)"
        type: boolean
        default: false
      release:
        description: "HDL_RELEASE for the real build"
        default: hdl_2023_r2
      project:
        description: "HDL_PROJECT for the real build"
        default: fmcomms2
      board:
        description: "HDL_BOARD for the real build"
        default: zed

permissions:
  contents: read

env:
  # Upstream cim release the manifests are validated against. Bump deliberately.
  CIM_VERSION: v1.2.4
  # analogdevicesinc/hdl keeps docs images in LFS (some objects missing upstream);
  # builds don't need them and smudging breaks the clone on hosts with git-lfs.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning targets/hdl/build-hdl.sh

      - name: Python compiles
        run: python3 -m py_compile targets/adi-linux/*.py tests/*.py

      - name: Manifests parse as YAML
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml
          files = sorted(pathlib.Path("targets").glob("*/*.yml"))
          for f in files:
              yaml.safe_load(f.read_text())
              print("ok", f)
          sys.exit(0 if files else 1)
          EOF

  test:
    name: adi-linux tests + cim init smoke (hosted)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install upstream cim
        run: bash .github/scripts/install-cim.sh "$CIM_VERSION"

      - name: Targets are discoverable
        run: |
          set -euo pipefail
          cim list-targets --source . | tee targets.txt
          for t in hdl adi-linux; do grep -q -- "- $t\$" targets.txt; done

      - name: adi-linux tests
        run: python3 -m unittest discover -s tests -p 'test_[al]*.py' -v

      - name: Smoke-init adi-linux
        run: |
          set -euo pipefail
          cim init --source . -t adi-linux --workspace "$RUNNER_TEMP/ws-linux" --yes
          cd "$RUNNER_TEMP/ws-linux"
          cim makefile
          make list-combos
          make guide-dry-run </dev/null

  hdl:
    name: hdl tests + Vivado (hdl-dev-2)
    runs-on: [self-hosted, hdl-dev-2, vivado]
    # Never run two Vivado jobs on the box at once; hdl clones are ~1.5 GB each.
    concurrency:
      group: hdl-dev-2-datax-manifests
      cancel-in-progress: false
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - name: Install upstream cim
        run: bash .github/scripts/install-cim.sh "$CIM_VERSION"

      - name: hdl tests (incl. real cim init)
        run: python3 -m unittest discover -s tests -p 'test_hdl_*.py' -v
        env:
          CIM_NETWORK: "1"

      - name: Smoke-init hdl
        run: |
          set -euo pipefail
          ws="$RUNNER_TEMP/ws-hdl"
          rm -rf "$ws"
          cim init --source . -t hdl --workspace "$ws" --yes
          cd "$ws"
          cim makefile
          # Both Vivado versions are installed on hdl-dev-2: resolution must succeed.
          make check-tools
          make check-tools HDL_RELEASE=hdl_2023_r2
          make list-combos | tail -3
          make list-combos HDL_RELEASE=hdl_2023_r2 | tail -3
          test "$(git -C hdl rev-parse --abbrev-ref HEAD)" = hdl_2023_r2
          bash scripts/build-hdl.sh --release hdl_2023_r2 --project fmcomms2 --board zed --dry-run
          bash scripts/build-hdl.sh --release hdl_2026_r1 --project fmcomms2 --board zcu102 --dry-run

      - name: Real Vivado build (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ws-hdl"
          make sdk-build HDL_RELEASE="${{ inputs.release }}" HDL_PROJECT="${{ inputs.project }}" HDL_BOARD="${{ inputs.board }}"
          ls -la "hdl/projects/${{ inputs.project }}/${{ inputs.board }}/build/"*.sdk/system_top.xsa

      - name: Clean workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/ws-hdl"
