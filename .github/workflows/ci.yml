name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Upstream cim release the manifests are validated against. Bump deliberately.
  CIM_VERSION: v1.2.4
  # analogdevicesinc/hdl keeps docs images in LFS (some objects missing upstream);
  # builds don't need them and smudging breaks the clone on runners with git-lfs.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  test:
    name: Tests + cim init smoke (upstream cim)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install upstream cim
        run: |
          set -euo pipefail
          url="https://github.com/analogdevicesinc/cim/releases/download/${CIM_VERSION}/cim-suite-${CIM_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar xz -C /tmp
          sudo install -m 0755 /tmp/cim-suite-${CIM_VERSION}-x86_64-unknown-linux-gnu/cim /usr/local/bin/cim
          cim --version

      - name: Targets are discoverable
        run: |
          set -euo pipefail
          cim list-targets --source . | tee targets.txt
          for t in hdl adi-linux; do grep -q -- "- $t\$" targets.txt; done

      - name: Offline + workspace tests
        env:
          CIM_NETWORK: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Smoke-init hdl
        run: |
          set -euo pipefail
          cim init --source . -t hdl --workspace /tmp/ws-hdl --yes
          cd /tmp/ws-hdl
          cim makefile
          make check-tools || true   # no EDA tools on the runner; just exercise resolution
          make list-combos | tail -3
          make list-combos HDL_RELEASE=hdl_2023_r2 | tail -3
          test "$(git -C hdl rev-parse --abbrev-ref HEAD)" = hdl_2023_r2
          make -n sdk-build HDL_RELEASE=hdl_2023_r2 HDL_PROJECT=fmcomms2 HDL_BOARD=zed | grep -- '--release "hdl_2023_r2"'

      - name: Smoke-init adi-linux
        run: |
          set -euo pipefail
          cim init --source . -t adi-linux --workspace /tmp/ws-linux --yes
          cd /tmp/ws-linux
          cim makefile
          make list-combos
          make guide-dry-run </dev/null
