<svg xmlns="http://www.w3.org/2000/svg" class="datax-diagram no-background" viewBox="0 0 780 420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>The DataX stack and the layers built by datax-manifests</title>
  <style>
    .layer { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-opacity: 0.35; }
    .built { fill: #2d7ff9; fill-opacity: 0.12; stroke: #2d7ff9; stroke-opacity: 0.9; stroke-width: 1.5; }
    .num   { fill: currentColor; fill-opacity: 0.55; font-size: 11px; }
    .name  { fill: currentColor; font-weight: 600; }
    .what  { fill: currentColor; fill-opacity: 0.75; }
    .accent{ fill: #2d7ff9; font-weight: 600; }
    .mono  { font-family: 'JetBrains Mono', 'Fira Mono', Consolas, monospace; font-size: 12px; fill: currentColor; fill-opacity: 0.85; }
    .brace { fill: none; stroke: #2d7ff9; stroke-width: 1.5; }
  </style>

  <!-- layers, top (7) to bottom (1) -->
  <g>
    <rect class="layer" x="20" y="20"  width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="48">7</text>
    <text class="name" x="56" y="40">Applications</text>
    <text class="what" x="56" y="57">Scopy · IIO Oscilloscope · MATLAB toolboxes</text>

    <rect class="layer" x="20" y="72"  width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="100">6</text>
    <text class="name" x="56" y="92">Language bindings</text>
    <text class="what" x="56" y="109">pyadi-iio · MATLAB · C/C++</text>

    <rect class="layer" x="20" y="124" width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="152">5</text>
    <text class="name" x="56" y="144">Libraries</text>
    <text class="what" x="56" y="161">libiio / iiod — local, USB, network, serial backends</text>

    <rect class="built" x="20" y="176" width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="204">4</text>
    <text class="name" x="56" y="196">Drivers</text>
    <text class="what" x="56" y="213">Linux IIO drivers for 1500+ ADI parts</text>

    <rect class="built" x="20" y="228" width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="256">3</text>
    <text class="name" x="56" y="248">HDL &amp; firmware</text>
    <text class="what" x="56" y="265">ADI HDL reference designs · u-boot · Arm Trusted Firmware</text>

    <rect class="layer" x="20" y="280" width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="308">2</text>
    <text class="name" x="56" y="300">Hardware interface</text>
    <text class="what" x="56" y="317">Zynq-7000 · Zynq UltraScale+ · Versal · Intel SoC · Lattice</text>

    <rect class="layer" x="20" y="332" width="440" height="46" rx="6"/>
    <text class="num"  x="34" y="360">1</text>
    <text class="name" x="56" y="352">Hardware</text>
    <text class="what" x="56" y="369">ADCs · DACs · RF transceivers (AD9361, AD9081, ADRV9002 …)</text>
  </g>

  <!-- brace marking layers 3-4 -->
  <path class="brace" d="M 476 178 q 10 0 10 10 v 32 q 0 5 6 5 q -6 0 -6 5 v 32 q 0 10 -10 10"/>

  <!-- what this repository builds -->
  <g>
    <text class="accent" x="506" y="196">Built by this repository</text>
    <text class="mono" x="506" y="218">adi-linux</text>
    <text class="what" x="664" y="218">→ kernel image</text>
    <text class="mono" x="506" y="240">hdl, hdl-boot</text>
    <text class="what" x="664" y="240">→ XSA, BOOT.BIN</text>
    <text class="mono" x="506" y="262">u-boot-xlnx</text>
    <text class="what" x="664" y="262">→ u-boot.elf</text>
    <text class="mono" x="506" y="284">arm-trusted-firmware</text>
    <text class="what" x="664" y="284">→ bl31.elf</text>
  </g>

  <!-- consumer note -->
  <text class="what" x="20" y="404" font-size="12">Layers 5–7 consume what 3–4 produce; only the connection URI changes between USB, network and on-board use.</text>
</svg>
