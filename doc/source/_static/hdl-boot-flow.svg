<svg xmlns="http://www.w3.org/2000/svg" class="datax-diagram no-background" viewBox="0 0 940 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>hdl-boot: how make sdk-build produces a BOOT.BIN from source</title>
  <style>
    .box   { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-opacity: 0.4; }
    .step  { fill: #2d7ff9; fill-opacity: 0.10; stroke: #2d7ff9; stroke-opacity: 0.9; stroke-width: 1.5; }
    .out   { fill: #2d7ff9; fill-opacity: 0.22; stroke: #2d7ff9; stroke-width: 1.5; }
    .t     { fill: currentColor; }
    .h     { fill: currentColor; font-weight: 600; }
    .dim   { fill: currentColor; fill-opacity: 0.7; font-size: 11px; }
    .mono  { font-family: 'JetBrains Mono', 'Fira Mono', Consolas, monospace; font-size: 11px; fill: currentColor; fill-opacity: 0.9; }
    .edge  { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.5; marker-end: url(#arrow); }
    .lane  { fill: none; stroke: currentColor; stroke-opacity: 0.18; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.55"/>
    </marker>
  </defs>

  <!-- 1. cim init -->
  <rect class="box" x="20" y="130" width="150" height="140" rx="6"/>
  <text class="h" x="32" y="150">cim init -t hdl-boot</text>
  <text class="dim" x="32" y="170">clones</text>
  <text class="mono" x="40" y="186">hdl/</text>
  <text class="mono" x="40" y="201">u-boot-xlnx/</text>
  <text class="mono" x="40" y="216">arm-trusted-firmware/</text>
  <text class="dim" x="32" y="236">copies</text>
  <text class="mono" x="40" y="252">scripts/build-*.sh</text>
  <path class="edge" d="M 170 200 H 200"/>

  <!-- 2. make sdk-build -->
  <rect class="box" x="202" y="150" width="184" height="100" rx="6"/>
  <text class="h" x="214" y="172">make sdk-build</text>
  <text class="mono" x="214" y="192">HDL_RELEASE=hdl_2026_r1</text>
  <text class="mono" x="214" y="207">HDL_PROJECT=jupiter_sdr</text>
  <text class="mono" x="214" y="222">HDL_BOARD=…</text>
  <text class="dim" x="214" y="240">depends_on → runs first:</text>

  <!-- fan-out edges -->
  <path class="edge" d="M 386 200 H 404 V 70  H 428"/>
  <path class="edge" d="M 386 200 H 404 V 200 H 428"/>
  <path class="edge" d="M 386 200 H 404 V 330 H 428"/>

  <!-- 3a. u-boot -->
  <rect class="step" x="430" y="40" width="190" height="60" rx="6"/>
  <text class="h" x="442" y="60">build-uboot.sh</text>
  <text class="dim" x="442" y="76">preset from project/board;</text>
  <text class="dim" x="442" y="90">ref follows HDL_RELEASE</text>
  <rect class="out" x="650" y="52" width="100" height="36" rx="6"/>
  <text class="mono" x="665" y="74">u-boot.elf</text>
  <path class="edge" d="M 620 70 H 648"/>

  <!-- 3b. ATF -->
  <rect class="step" x="430" y="170" width="190" height="60" rx="6"/>
  <text class="h" x="442" y="190">build-atf.sh</text>
  <text class="dim" x="442" y="206">PLAT from the device (zynqmp /</text>
  <text class="dim" x="442" y="220">versal); skipped for Zynq-7000</text>
  <rect class="out" x="650" y="182" width="100" height="36" rx="6"/>
  <text class="mono" x="673" y="204">bl31.elf</text>
  <path class="edge" d="M 620 200 H 648"/>

  <!-- 3c. HDL -->
  <rect class="step" x="430" y="300" width="190" height="60" rx="6"/>
  <text class="h" x="442" y="320">build-hdl.sh</text>
  <text class="dim" x="442" y="336">switch hdl/ to release,</text>
  <text class="dim" x="442" y="350">Vivado synth + implement</text>
  <rect class="out" x="650" y="312" width="100" height="36" rx="6"/>
  <text class="mono" x="656" y="334">system_top.xsa</text>
  <path class="edge" d="M 620 330 H 648"/>

  <!-- fan-in to BOOT.BIN helper -->
  <path class="edge" d="M 750 70  H 768 V 200 H 786"/>
  <path class="edge" d="M 750 200 H 786"/>
  <path class="edge" d="M 750 330 H 768 V 200 H 786"/>

  <!-- 4. boot bin -->
  <rect class="step" x="788" y="150" width="140" height="100" rx="6"/>
  <text class="h" x="798" y="170">build_*_boot_bin.sh</text>
  <text class="dim" x="798" y="188">xsct: FSBL, PMUFW</text>
  <text class="dim" x="798" y="202">bootgen:</text>
  <text class="dim" x="798" y="216">fsbl + pmufw + bit</text>
  <text class="dim" x="798" y="230">+ bl31 + u-boot</text>
  <path class="edge" d="M 858 250 V 286"/>
  <rect class="out" x="820" y="288" width="76" height="34" rx="6"/>
  <text class="h" x="831" y="310">BOOT.BIN</text>

  <!-- lane hints -->
  <text class="dim" x="430" y="26">u-boot-xlnx/</text>
  <text class="dim" x="430" y="156">arm-trusted-firmware/</text>
  <text class="dim" x="430" y="286">hdl/projects/&lt;project&gt;/</text>
  <text class="dim" x="20" y="390">BOOT_BIN_UBOOT=download / BOOT_BIN_ATF=download replace a lane with ADI's prebuilt file; BUILD_BOOT_BIN=false skips both lanes and the final step.</text>
</svg>
